    {% load static tailwind_tags %}
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <title>Garcia Reading manager</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        {% tailwind_css %}
    </head>

    <body class="bg-gray-900 text-black font-semibold">
    <div id="top" class="container">
        <div class="flex justify-start h-32 min-w-screen bg-gray-800">
            <ul class="flex flex-row space-x-16 text-bold text-xl">
                <li href="#">Biblioteca</li>
                <li href="#">Social</li>
                <li href="#">Perfil</li>
                <li href="#">livros com desconto</li>
            </ul>
        </div>
    <div class="grid grid-cols-[repeat(auto-fill,16rem)] gap-6 bg-gray-500 min-h-dvh min-w-screen">
        {% for book in books %}
            <section class="flex flex-col h-96 w-64 bg-yellow-500 place-items-center rounded-4xl">
                <img class="mt-6 h-30 w-22" src="https://picsum.photos/200/300"></img>
                <h2 class="mt-2 font-bold text-xl">{{ book.title }}</h2>
            </section>
        {% endfor %}
    </div>  
    </div>
    </body>
    </html>
